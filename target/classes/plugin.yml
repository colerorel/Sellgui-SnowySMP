name: GuiSell
version: '1.1'
main: com.colerorel.guisell.GuiSellPlugin
api-version: '1.21'
prefix: SnowySMP
depend: [Vault]
commands:
  guisell:
    description: Open the dupe-proof sell interface.
    permission: guisell.use
    aliases: [sellgui]
  worth:
    description: Check item values or manage the worth list.
    permission: guisell.use
permissions:
  guisell.use:
    description: Allows players to sell and check worth.
    default: true
  guisell.admin:
    description: Allows removing items and restoring them.
    default: op